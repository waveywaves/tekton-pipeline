# Squash Command Workflow (test setup - points to waveywaves/plumbing fork)
name: Squash Command

on:
  repository_dispatch:
    types: [squash-command]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  squash:
    name: Squash PR
    uses: waveywaves/plumbing/.github/workflows/_squash-command.yaml@be4a4fcda2bd9ded14c1ff9823bdb9976ff1ebd7
    secrets:
      CHATOPS_TOKEN: ${{ secrets.CHATOPS_TOKEN }}
